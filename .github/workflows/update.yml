name: Update VPN

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect subscriptions
        run: python collect_vpn.py

      - name: Build subscription
        run: python build_subscription.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vpn_subscriptions.json subscription_base64.txt subscription_plain.txt
          git diff --staged --quiet || git commit -m "Auto-update [skip ci]"
          git push
